name: Frontend CI/CD

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blocki-frontend-production
  cancel-in-progress: false

jobs:
  ci:
    name: Frontend Test
    runs-on: ubuntu-latest

    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 정적 분석
        run: npm run lint

      - name: 테스트 실행
        run: npm run test -- --run

      - name: 프로덕션 빌드 확인
        run: npm run build

  deploy:
    name: Deploy to Frontend EC2
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: SSH 개인키 설정
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: 프론트엔드 빌드 및 배포
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          BACKEND_PRIVATE_IP: ${{ secrets.BACKEND_PRIVATE_IP }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$EC2_USER@$EC2_HOST" \
            "DEPLOY_SHA=$DEPLOY_SHA BACKEND_PRIVATE_IP=$BACKEND_PRIVATE_IP bash -s" <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR=/opt/blocki-frontend
          APP_NAME=blocki-frontend
          PREVIOUS_NAME=blocki-frontend-previous
          IMAGE_TAG="blocki-frontend:${DEPLOY_SHA:0:7}"
          HAS_PREVIOUS=false

          rollback() {
            echo "배포 실패: 직전 컨테이너로 복구합니다."

            docker rm -f "$APP_NAME" >/dev/null 2>&1 || true

            if [ "$HAS_PREVIOUS" = "true" ] \
              && docker container inspect "$PREVIOUS_NAME" >/dev/null 2>&1; then
              docker rename "$PREVIOUS_NAME" "$APP_NAME"
              docker start "$APP_NAME"
            fi
          }

          cd "$APP_DIR"

          if [ -n "$(git status --porcelain)" ]; then
            echo "서버 소스에 커밋되지 않은 변경 사항이 있어 배포를 중단합니다."
            exit 1
          fi

          git fetch --depth=50 origin main
          git checkout --detach -f "$DEPLOY_SHA"

          echo "Docker 이미지 빌드: $IMAGE_TAG"
          docker build \
            --build-arg VITE_API_ORIGIN="" \
            -t "$IMAGE_TAG" \
            .

          if docker container inspect "$APP_NAME" >/dev/null 2>&1; then
            docker rm -f "$PREVIOUS_NAME" >/dev/null 2>&1 || true
            docker stop "$APP_NAME"
            docker rename "$APP_NAME" "$PREVIOUS_NAME"
            HAS_PREVIOUS=true
          fi

          if ! docker run -d \
            --name "$APP_NAME" \
            --restart unless-stopped \
            --add-host "api:$BACKEND_PRIVATE_IP" \
            -p 80:80 \
            "$IMAGE_TAG"; then
            rollback
            exit 1
          fi

          for attempt in {1..15}; do
            if curl -fsSI http://127.0.0.1/ >/dev/null; then
              echo "프론트엔드 배포 및 헬스체크 성공"
              docker ps --filter "name=$APP_NAME"
              exit 0
            fi

            sleep 2
          done

          echo "프론트엔드 헬스체크 실패"
          docker logs --tail 100 "$APP_NAME" || true
          rollback
          exit 1
          REMOTE